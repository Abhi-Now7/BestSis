<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Best Sister – Mobile</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:'Poppins',sans-serif;
      background:#1a0008;
      height:100dvh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      overflow:hidden; user-select:none;
      -webkit-user-select:none;
      padding:16px;
      gap:16px;
    }

    h1 { color:#fff; font-size:clamp(.85rem,3.5vw,1.1rem); font-weight:700; text-align:center; opacity:.8; }

    /* Card container */
    .deck {
      position:relative;
      width:min(320px,85vw);
      height:min(480px,65dvh);
      flex-shrink:0;
    }

    .card {
      position:absolute; inset:0;
      background:#fff0f3;
      border-radius:20px;
      box-shadow:0 12px 40px rgba(0,0,0,.45);
      overflow:hidden;
      display:flex; flex-direction:column;
      touch-action:none;
      cursor:grab;
      will-change:transform;
    }
    .card:active { cursor:grabbing; }

    .card-img {
      flex:0 0 52%;
      background:linear-gradient(145deg,#ff8fab,#ff4b6e 70%,#c9184a);
      display:flex; align-items:center; justify-content:center;
      position:relative;
    }
    .card-img::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(to bottom,transparent 55%,rgba(255,240,243,.7));
    }

    .avatar { font-size:clamp(5rem,18vw,7rem); z-index:1; animation:bobble 3s ease-in-out infinite; }
    @keyframes bobble { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

    .sparkle { position:absolute; z-index:1; animation:twink 2s ease-in-out infinite; font-size:1.2rem; }
    .sparkle:nth-child(1){top:15%;left:12%}
    .sparkle:nth-child(2){top:10%;right:14%;animation-delay:.6s}
    .sparkle:nth-child(3){bottom:25%;left:8%;animation-delay:1.2s}
    @keyframes twink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.6)} }

    .card-body { flex:1; padding:14px 18px; display:flex; flex-direction:column; justify-content:space-between; }
    .name { font-size:clamp(1.15rem,5vw,1.5rem); font-weight:800; color:#2d0a16; line-height:1.15; }
    .tag { display:inline-block; margin-top:4px; background:#ff4b6e; color:#fff; font-size:.65rem; font-weight:700; padding:3px 10px; border-radius:999px; }
    .stats { display:flex; gap:16px; margin-top:6px; }
    .stat-val { font-size:.95rem; font-weight:800; color:#2d0a16; }
    .stat-lbl { font-size:.58rem; color:#9b2a4a; opacity:.75; }

    /* Swipe labels */
    .sw { position:absolute; top:24px; font-size:1.2rem; font-weight:800; padding:4px 14px; border:3px solid; border-radius:8px; opacity:0; pointer-events:none; z-index:10; }
    .sw.no  { left:14px; color:#ff4b6e; border-color:#ff4b6e; transform:rotate(-12deg); }
    .sw.yes { right:14px; color:#3ddc84; border-color:#3ddc84; transform:rotate(12deg); }

    /* Buttons */
    .actions { display:flex; gap:20px; flex-shrink:0; }
    .ab { width:56px; height:56px; border-radius:50%; border:none; font-size:1.5rem; display:flex; align-items:center; justify-content:center; background:#fff; box-shadow:0 4px 16px rgba(0,0,0,.35); cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .1s; }
    .ab:active { transform:scale(.9); }

    /* Modal */
    .mo { position:fixed; inset:0; background:rgba(26,0,8,.9); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .3s; z-index:50; }
    .mo.on { opacity:1; pointer-events:all; }
    .mi { background:#fff0f3; border-radius:24px; padding:32px 28px; text-align:center; width:min(300px,82vw); transform:scale(.85); transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
    .mo.on .mi { transform:scale(1); }
    .me { font-size:3.5rem; margin-bottom:10px; }
    .mm { font-size:clamp(.95rem,4vw,1.15rem); font-weight:700; color:#2d0a16; line-height:1.4; }
    .mb { margin-top:20px; background:#ff4b6e; color:#fff; border:none; border-radius:999px; padding:12px 28px; font-family:'Poppins',sans-serif; font-size:.85rem; font-weight:700; cursor:pointer; -webkit-tap-highlight-color:transparent; }

    @media (prefers-reduced-motion:reduce) { .avatar,.sparkle { animation:none; } }
  </style>
</head>
<body>

  <h1>🏆 Best Sister Award</h1>

  <div class="deck" id="deck">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Swipe card for Krisha Haralalka">
      <span class="sw no" id="lN">NOPE</span>
      <span class="sw yes" id="lY">YEP!</span>
      <div class="card-img">
        <span class="sparkle">✨</span>
        <span class="sparkle">⭐</span>
        <span class="sparkle">💫</span>
        <span class="avatar">👸</span>
      </div>
      <div class="card-body">
        <div>
          <div class="name">Krisha<br>Haralalka</div>
          <span class="tag">Candidate #1</span>
        </div>
        <div class="stats">
          <div><span class="stat-val">100%</span><br><span class="stat-lbl">Sister energy</span></div>
          <div><span class="stat-val">∞</span><br><span class="stat-lbl">Love given</span></div>
          <div><span class="stat-val">#1</span><br><span class="stat-lbl">Of 1 options</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="ab" id="bN" aria-label="Nope">❌</button>
    <button class="ab" id="bY" aria-label="Yep">💖</button>
  </div>

  <div class="mo" id="mod" role="dialog" aria-modal="true">
    <div class="mi">
      <div class="me" id="mE"></div>
      <div class="mm" id="mM"></div>
      <button class="mb" id="mC">Try again 🔄</button>
    </div>
  </div>

  <script>
    const C=document.getElementById('card'),
          lN=document.getElementById('lN'),
          lY=document.getElementById('lY'),
          mod=document.getElementById('mod'),
          mE=document.getElementById('mE'),
          mM=document.getElementById('mM'),
          mC=document.getElementById('mC'),
          bN=document.getElementById('bN'),
          bY=document.getElementById('bY');

    let sx=0,sy=0,dx=0,drag=false;
    const TH=80,MR=14;
    const gx=e=>e.touches?e.touches[0].clientX:e.clientX;
    const gy=e=>e.touches?e.touches[0].clientY:e.clientY;

    function start(e){drag=true;sx=gx(e);sy=gy(e);C.style.transition='none';}
    function move(e){
      if(!drag)return;
      dx=gx(e)-sx;const dy=gy(e)-sy;
      C.style.transform=`translate(${dx}px,${dy*.25}px) rotate(${(dx/350)*MR}deg)`;
      const r=Math.min(Math.abs(dx)/TH,1);
      lN.style.opacity=dx<0?r:0;
      lY.style.opacity=dx>0?r:0;
    }
    function end(){
      if(!drag)return;drag=false;
      Math.abs(dx)>=TH?fly(dx>0?'r':'l'):snap();
    }
    function snap(){C.style.transition='transform .35s cubic-bezier(.34,1.56,.64,1)';C.style.transform='';lN.style.opacity=lY.style.opacity=0;dx=0;}
    function fly(d){
      const x=d==='r'?innerWidth+200:-innerWidth-200;
      C.style.transition='transform .4s ease,opacity .4s';
      C.style.transform=`translate(${x}px,-40px) rotate(${d==='r'?MR:-MR}deg)`;
      C.style.opacity='0';
      setTimeout(()=>show(d),350);
    }
    function show(d){
      mE.textContent=d==='l'?'😢':'🥲';
      mM.textContent=d==='l'?"Too bad she's the only option you've got! 🥰🥰🥰":"Itna darrte ho kya usse 🥲🥲🥲";
      mod.classList.add('on');
    }
    function close(){mod.classList.remove('on');C.style.transition='none';C.style.transform='';C.style.opacity='1';lN.style.opacity=lY.style.opacity=0;dx=0;}

    C.addEventListener('mousedown',start);
    C.addEventListener('touchstart',start,{passive:true});
    document.addEventListener('mousemove',move);
    document.addEventListener('touchmove',move,{passive:true});
    document.addEventListener('mouseup',end);
    document.addEventListener('touchend',end);
    bN.addEventListener('click',()=>{dx=-TH;fly('l');});
    bY.addEventListener('click',()=>{dx=TH;fly('r');});
    C.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){dx=-TH;fly('l');}if(e.key==='ArrowRight'){dx=TH;fly('r');}});
    mC.addEventListener('click',close);
    mod.addEventListener('click',e=>{if(e.target===mod)close();});
  </script>
</body>
</html>
