<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Sister Award 🏆</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --rose: #FF4B6E;
      --blush: #FFF0F3;
      --plum: #2D0A16;
      --gold: #FFD36E;
      --green: #3DDC84;
      --red: #FF4B6E;
      --card-w: 340px;
      --card-h: 520px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #1a0008;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* Background shimmer blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
    }
    .blob1 { width: 500px; height: 500px; background: #FF4B6E; top: -100px; left: -150px; }
    .blob2 { width: 400px; height: 400px; background: #c026d3; bottom: -100px; right: -100px; }
    .blob3 { width: 300px; height: 300px; background: #FFD36E; bottom: 30%; left: -80px; }

    h1.title {
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 32px;
      opacity: 0.75;
      text-align: center;
    }

    /* Swipe hint arrows */
    .hints {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      pointer-events: none;
      z-index: 0;
    }
    .hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0.35;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .hint-icon {
      font-size: 2rem;
    }
    .hint.nope { color: #FF6B8A; }
    .hint.yes { color: #3DDC84; }

    /* Deck area */
    .deck {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      z-index: 1;
    }

    /* The card */
    .card {
      position: absolute;
      inset: 0;
      background: var(--blush);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 4px 16px rgba(255,75,110,0.2);
      cursor: grab;
      transition: box-shadow 0.2s;
      overflow: hidden;
      touch-action: none;
      display: flex;
      flex-direction: column;
    }
    .card:active { cursor: grabbing; }

    /* Card image area */
    .card-img {
      flex: 0 0 58%;
      background: linear-gradient(145deg, #ff8fab, #ff4b6e 60%, #c9184a);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .card-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 60%, rgba(255,240,243,0.8));
    }
    .avatar-emoji {
      font-size: 8rem;
      z-index: 1;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.25));
      animation: floatAvatar 3s ease-in-out infinite;
    }
    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Sparkle decoration in image area */
    .sparkle {
      position: absolute;
      font-size: 1.4rem;
      z-index: 1;
      animation: twinkle 2s ease-in-out infinite;
    }
    .sparkle:nth-child(1) { top: 18%; left: 14%; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: 12%; right: 18%; animation-delay: 0.5s; }
    .sparkle:nth-child(3) { bottom: 28%; left: 10%; animation-delay: 1s; }
    .sparkle:nth-child(4) { bottom: 26%; right: 12%; animation-delay: 1.5s; }
    @keyframes twinkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* Card content */
    .card-body {
      flex: 1;
      padding: 20px 24px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-name {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--plum);
      line-height: 1.1;
    }
    .card-tag {
      display: inline-block;
      margin-top: 4px;
      background: var(--rose);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 100px;
      letter-spacing: 0.05em;
    }
    .card-stats {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }
    .stat {
      display: flex;
      flex-direction: column;
    }
    .stat-val {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--plum);
    }
    .stat-label {
      font-size: 0.65rem;
      font-weight: 500;
      color: #9b2a4a;
      opacity: 0.75;
    }

    /* Swipe indicators overlaid on card */
    .swipe-label {
      position: absolute;
      top: 36px;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      padding: 6px 18px;
      border-radius: 10px;
      border-width: 3px;
      border-style: solid;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
      z-index: 10;
    }
    .swipe-label.nope {
      left: 20px;
      color: #FF4B6E;
      border-color: #FF4B6E;
      transform: rotate(-15deg);
    }
    .swipe-label.yep {
      right: 20px;
      color: var(--green);
      border-color: var(--green);
      transform: rotate(15deg);
    }

    /* Action buttons */
    .actions {
      display: flex;
      gap: 24px;
      margin-top: 32px;
      z-index: 1;
    }
    .btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      transition: transform 0.12s, box-shadow 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { transform: scale(1.08); box-shadow: 0 10px 28px rgba(0,0,0,0.45); }
    .btn:active { transform: scale(0.95); }
    .btn-nope { background: #fff; }
    .btn-yes  { background: #fff; }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 0, 8, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .modal-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }
    .modal {
      background: var(--blush);
      border-radius: 28px;
      padding: 44px 36px;
      max-width: 340px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      transform: scale(0.85);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.visible .modal {
      transform: scale(1);
    }
    .modal-emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 14px;
      animation: bounceBig 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes bounceBig {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    .modal-msg {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--plum);
      line-height: 1.4;
    }
    .modal-btn {
      margin-top: 28px;
      background: var(--rose);
      color: #fff;
      border: none;
      border-radius: 100px;
      padding: 14px 36px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background 0.1s;
    }
    .modal-btn:hover { background: #e63560; transform: scale(1.03); }
    .modal-btn:active { transform: scale(0.97); }

    @media (max-width: 400px) {
      :root { --card-w: 300px; --card-h: 480px; }
      .avatar-emoji { font-size: 6.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .avatar-emoji, .sparkle { animation: none; }
    }
  </style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <h1 class="title">🏆 Best Sister Award — You Decide</h1>

  <div class="hints" aria-hidden="true">
    <div class="hint nope">
      <span class="hint-icon">👈</span>
      Nope
    </div>
    <div class="hint yes">
      Yep
      <span class="hint-icon">👉</span>
    </div>
  </div>

  <div class="deck" id="deck">
    <div class="card" id="card" role="button" aria-label="Swipe card for Krisha Haralalka" tabindex="0">
      <span class="swipe-label nope" id="labelNope">NOPE</span>
      <span class="swipe-label yep"  id="labelYep">YEP!</span>

      <div class="card-img">
        <span class="sparkle">✨</span>
        <span class="sparkle">⭐</span>
        <span class="sparkle">💫</span>
        <span class="sparkle">✨</span>
        <span class="avatar-emoji">👸</span>
      </div>

      <div class="card-body">
        <div>
          <div class="card-name">Krisha<br>Haralalka</div>
          <span class="card-tag">Candidate #1</span>
        </div>
        <div class="card-stats">
          <div class="stat">
            <span class="stat-val">100%</span>
            <span class="stat-label">Sister energy</span>
          </div>
          <div class="stat">
            <span class="stat-val">∞</span>
            <span class="stat-label">Love given</span>
          </div>
          <div class="stat">
            <span class="stat-val">#1</span>
            <span class="stat-label">Of 1 options</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-nope" id="btnNope" aria-label="Swipe left — Nope" title="Nope">❌</button>
    <button class="btn btn-yes"  id="btnYes"  aria-label="Swipe right — Yep" title="Yep!">💖</button>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-live="assertive">
    <div class="modal">
      <span class="modal-emoji" id="modalEmoji"></span>
      <p class="modal-msg" id="modalMsg"></p>
      <button class="modal-btn" id="modalClose">Try again 🔄</button>
    </div>
  </div>

  <script>
    const card       = document.getElementById('card');
    const labelNope  = document.getElementById('labelNope');
    const labelYep   = document.getElementById('labelYep');
    const modal      = document.getElementById('modal');
    const modalEmoji = document.getElementById('modalEmoji');
    const modalMsg   = document.getElementById('modalMsg');
    const modalClose = document.getElementById('modalClose');
    const btnNope    = document.getElementById('btnNope');
    const btnYes     = document.getElementById('btnYes');

    let startX = 0, startY = 0, curX = 0, dragging = false;
    const THRESHOLD = 100; // px to count as a swipe
    const MAX_ROT   = 18;  // deg

    function getClientX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
    function getClientY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

    function onStart(e) {
      dragging = true;
      startX = getClientX(e);
      startY = getClientY(e);
      card.style.transition = 'none';
    }
    function onMove(e) {
      if (!dragging) return;
      curX = getClientX(e) - startX;
      const curY = getClientY(e) - startY;
      const rot = (curX / 400) * MAX_ROT;
      card.style.transform = `translate(${curX}px, ${curY * 0.3}px) rotate(${rot}deg)`;

      const ratio = Math.min(Math.abs(curX) / THRESHOLD, 1);
      if (curX < 0) {
        labelNope.style.opacity = ratio;
        labelYep.style.opacity  = 0;
      } else {
        labelYep.style.opacity  = ratio;
        labelNope.style.opacity = 0;
      }
    }
    function onEnd() {
      if (!dragging) return;
      dragging = false;
      if (Math.abs(curX) >= THRESHOLD) {
        flyOut(curX > 0 ? 'right' : 'left');
      } else {
        resetCard();
      }
    }

    function flyOut(direction) {
      const flyX  = direction === 'right' ? window.innerWidth + 200 : -(window.innerWidth + 200);
      const rot   = direction === 'right' ? MAX_ROT : -MAX_ROT;
      card.style.transition = 'transform 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.45s';
      card.style.transform  = `translate(${flyX}px, -60px) rotate(${rot}deg)`;
      card.style.opacity    = '0';
      setTimeout(() => showModal(direction), 420);
    }

    function resetCard() {
      card.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
      card.style.transform  = 'translate(0,0) rotate(0deg)';
      labelNope.style.opacity = 0;
      labelYep.style.opacity  = 0;
      curX = 0;
    }

    function showModal(direction) {
      if (direction === 'left') {
        modalEmoji.textContent = '😢';
        modalMsg.textContent   = "Too bad she's the only option you've got! 🥰🥰🥰";
      } else {
        modalEmoji.textContent = '🥲';
        modalMsg.textContent   = "Itna darrte ho kya usse 🥲🥲🥲";
      }
      modal.classList.add('visible');
    }

    function closeModal() {
      modal.classList.remove('visible');
      // Reset card
      card.style.transition = 'none';
      card.style.transform  = 'translate(0,0) rotate(0deg)';
      card.style.opacity    = '1';
      labelNope.style.opacity = 0;
      labelYep.style.opacity  = 0;
      curX = 0;
    }

    // Pointer events (mouse + touch)
    card.addEventListener('mousedown',  onStart);
    card.addEventListener('touchstart', onStart, { passive: true });
    document.addEventListener('mousemove',  onMove);
    document.addEventListener('touchmove',  onMove, { passive: true });
    document.addEventListener('mouseup',   onEnd);
    document.addEventListener('touchend',  onEnd);

    // Buttons
    btnNope.addEventListener('click', () => { curX = -THRESHOLD; flyOut('left'); });
    btnYes.addEventListener('click',  () => { curX =  THRESHOLD; flyOut('right'); });

    // Keyboard (left/right arrow)
    card.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft')  { curX = -THRESHOLD; flyOut('left'); }
      if (e.key === 'ArrowRight') { curX =  THRESHOLD; flyOut('right'); }
    });

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  </script>
</body>
</html>
